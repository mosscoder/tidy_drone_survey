[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tidysurvey"
version = "0.4.1"
description = "Config-driven drone-survey pipeline: stitch, align, calibrate, report"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
dependencies = [
    "rasterio",
    "numpy",
    "scipy",
    "geopandas",
    "shapely",
    "affine",
    "joblib",
    "opencv-python",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
match = ["torch"]                                             # eFOLKI: align + seam merge
sentinel = ["earthengine-api", "google-auth", "requests", "pyproj"]
report = ["matplotlib"]
tiles = ["pmtiles", "Pillow"]

[project.scripts]
tidysurvey = "tidysurvey.cli:main"

[tool.setuptools]
packages = ["tidysurvey"]
